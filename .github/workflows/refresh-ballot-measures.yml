name: Refresh Ballot Measures

on:
  schedule:
    # Run on the 1st of every month at 7:00 AM UTC
    - cron: '0 7 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  refresh-ballot-measures:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create data directories
        run: mkdir -p data

      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install chromium --with-deps

      - name: Fetch ballot measures from Ballotpedia
        run: python3 scripts/fetch_ballot_measures.py

      - name: Install enrichment dependencies
        run: pip install anthropic

      - name: Enrich ballot measures with ideology scoring
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/enrich_ballot_measures.py

      - name: Commit updated ballot measures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force data/ballot-measures.json
          if git diff --cached --quiet; then
            echo "No ballot measure changes to commit"
          else
            git commit -m "chore: refresh ballot measures [automated]"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Ballot measure refresh is failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The scheduled ballot measure refresh failed on $(date -u +%Y-%m-%d). Run: $RUN_URL — check the job logs for which step failed (scrape, enrichment, or commit). This issue stays open and gets a comment on each further failure until a successful run auto-closes it."
          fi

      - name: Close failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Ballot measure refresh is failing"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "\"$TITLE\" in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --comment "Refresh succeeded on $(date -u +%Y-%m-%d) — closing."
          fi
